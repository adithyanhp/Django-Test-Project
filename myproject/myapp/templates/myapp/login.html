{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link rel="stylesheet" href="{% static 'css/auth.css' %}" />
  </head>
  <body>
    <!-- ADD THE STRUCTURE HERE -->
    <div class="auth-container">
      <div class="auth-card">
        <h2>Welcome Back</h2>
        <p>Please log into your account to manage students</p>

        <form method="POST">
          {% csrf_token %} {{ form.as_p }}

          <!-- Forgot Password link aligned nicely above or below fields -->
          <div class="form-options">
            <!-- Line 24 in your login.html -->
            <a href="{% url 'password_reset' %}" class="forgot-password"
              >Forgot password?</a
            >
          </div>

          <button type="submit" class="btn-submit">Sign In</button>
        </form>

        <p class="auth-switch">
          Don't have an account? <a href="{% url 'register' %}">Sign up here</a>
        </p>
      </div>
    </div>
  </body>
</html>
